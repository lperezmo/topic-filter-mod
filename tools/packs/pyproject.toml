[project]
name = "topic-packs"
version = "0.1.0"
description = "Builds topic-filter packs: term lists for one general topic, from public sources."
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "wordfreq>=3.1",
]

[project.scripts]
topic-packs = "topic_packs.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["topic_packs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
