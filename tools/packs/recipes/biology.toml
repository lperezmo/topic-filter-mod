# Molecular biology techniques and anatomical terminology, plus the
# vocabulary of biology. Category names were found with
# `topic-packs categories "<query>"`; they must match Wikipedia exactly.

name = "biology"
description = "Molecular biology techniques, cellular processes and anatomical terminology, and the vocabulary of biology."

datamuse = ["biology", "organism", "physiology", "taxonomy"]

extra_terms = [
  "CRISPR",
  "Cas9",
  "CRISPR-Cas9",
  "Western blot",
  "Southern blot",
  "Northern blot",
  "RNA-seq",
  "ChIP-seq",
  "scRNA-seq",
  "TALEN",
  "Femur",
  "Humerus",
  "Photosynthesis",
  "Mitosis",
]
extra_hints = []

exclude = [
  "Wingspan",
  "Squelching",
  "VectorDB",
  "Biofact",
  "Permissiveness",
  "Paratype",
  "Subvariety",
]

[[wikipedia]]
category = "Molecular biology techniques"

[[wikipedia]]
category = "Anatomical terminology"

[[wikipedia]]
category = "Cellular processes"
role = "hints"

[[wikipedia]]
