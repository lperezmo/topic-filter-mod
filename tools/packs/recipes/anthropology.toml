# Ancient Mesoamerican, Andean and Egyptian sites and civilizations, plus the
# vocabulary of anthropology and archaeology. Category names were found with
# `topic-packs categories "<query>"`; they must match Wikipedia exactly.

name = "anthropology"
description = "Ancient Mesoamerican, Andean and Egyptian sites, civilizations, rulers and deities, and the vocabulary of anthropology and archaeology."

# Seeds for Datamuse's "triggered by" words: loose associations, hints only.
